<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXORA einrichten</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#26366b 0,#111a35 38%,#090d19 78%);color:#f4f6ff;font:16px Segoe UI,Arial,sans-serif}.panel{width:min(520px,calc(100% - 36px));padding:38px;border:1px solid #ffffff20;border-radius:24px;background:#10182bd9;box-shadow:0 24px 80px #0008}.logo{font-size:34px;font-weight:800;letter-spacing:5px}.tag{color:#aab8e7;margin:8px 0 30px}.field{width:100%;padding:15px;border:1px solid #39496e;border-radius:12px;background:#0a1122;color:white;font-size:16px;margin:10px 0 14px}button{width:100%;padding:15px;border:0;border-radius:12px;background:linear-gradient(100deg,#6878ff,#9b65ed);color:white;font-weight:700;font-size:16px;cursor:pointer}small{display:block;color:#aab8d3;line-height:1.5;margin-top:20px}#error{color:#ff9d9d;min-height:24px}
</style></head>
<body><main class="panel"><div class="logo">NEXORA</div><div class="tag">Deine Notizen. Dein Bereich.</div><h2>Mit deinem Server verbinden</h2><p>Gib die Internetadresse deiner veröffentlichten NEXORA-Website ein.</p><form id="form"><input id="url" class="field" type="url" placeholder="https://deine-nexora.onrender.com" required><div id="error"></div><button type="submit">Verbinden</button></form><small>Du brauchst zuerst eine veröffentlichte NEXORA-Website. Die Desktop-App verbindet sich damit, damit Konten und Notizen auf allen Geräten synchron bleiben.</small></main><script src="setup.js"></script></body></html>
